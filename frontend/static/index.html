<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fantasy Dungeon Master</title>
<!-- Google Fonts: MedievalSharp, Outfit & Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=MedievalSharp&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Material Symbols Outlined for A2UI icons -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
  :root {
    --accent: #f59e0b; /* Vibrant amber / gold tone for fantasy theme */
    --accent-gradient: linear-gradient(135deg, #f59e0b, #d97706);
    --accent-glow: rgba(245, 158, 11, 0.3);
    --accent-hover: #d97706;
    --bg-dark: #090d16;
    --card-dark: #131b2e;
    --border-dark: #23314d;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --user-bubble: linear-gradient(135deg, #d97706, #b45309);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --header-height: 64px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
  }

  body {
    display: flex;
    flex-direction: column;
    background-image: 
      radial-gradient(circle at 50% 0%, #1e1b4b 0%, transparent 60%),
      radial-gradient(circle at 100% 100%, #172554 0%, transparent 50%),
      radial-gradient(circle at 0% 100%, #31103f 0%, #090d16 80%);
    background-attachment: fixed;
  }

  /* Header */
  header {
    height: var(--header-height);
    background: rgba(13, 19, 33, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(245, 158, 11, 0.2);
    color: #fcd34d;
    padding: 0 1.25rem;
    font-family: 'MedievalSharp', cursive;
    font-size: 1.5rem;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
    z-index: 10;
    flex-shrink: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    text-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
  }

  .brand-icon {
    font-size: 1.6rem;
  }

  header .subtitle {
    font-family: 'Outfit', sans-serif;
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 500;
    background: rgba(30, 41, 59, 0.7);
    padding: 0.3rem 0.75rem;
    border-radius: 12px;
    border: 1px solid var(--border-dark);
    letter-spacing: normal;
  }

  /* Chat Log Area */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 1rem 1.5rem 1rem;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  .msg {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
    animation: fadeIn 0.25s ease-out forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-items: flex-end;
  }

  .msg-author {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 0.35rem;
    padding: 0 0.5rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }

  .bubble {
    display: inline-block;
    padding: 0.9rem 1.15rem;
    border-radius: 18px;
    background: rgba(19, 27, 46, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border-dark);
    color: var(--text-main);
    text-align: left;
    max-width: 88%;
    line-height: 1.6;
    font-size: 0.95rem;
    white-space: pre-wrap;
    word-break: break-word;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
  }

  .msg.user .bubble {
    background: var(--user-bubble);
    color: #ffffff;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 16px var(--accent-glow);
  }

  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
    border-left: 3px solid var(--accent);
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
    width: 100%;
  }

  /* Attachment Pill Badge */
  .attachment-preview {
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 0.4rem 1rem 0 1rem;
    display: none;
    align-items: center;
    gap: 0.5rem;
  }

  .attachment-badge {
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid #f59e0b;
    color: #fcd34d;
    padding: 0.35rem 0.75rem;
    border-radius: 16px;
    font-size: 0.8rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .attachment-remove {
    cursor: pointer;
    color: #ef4444;
    font-weight: bold;
    margin-left: 0.2rem;
  }

  /* Quick Action Prompts Horizontal Carousel */
  .prompts-container {
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 0.4rem 1rem;
    display: flex;
    gap: 0.6rem;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    flex-shrink: 0;
  }

  .prompts-container::-webkit-scrollbar {
    display: none;
  }

  .prompt-chip {
    background: rgba(19, 27, 46, 0.9);
    border: 1px solid var(--border-dark);
    color: #fcd34d;
    padding: 0.55rem 0.95rem;
    border-radius: 24px;
    font-size: 0.825rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    gap: 0.4rem;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  .prompt-chip:active, .prompt-chip:hover {
    background: #1e293b;
    border-color: var(--accent);
    transform: scale(0.97);
    color: #ffffff;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  /* Bottom Sticky Form Container */
  .footer-container {
    background: rgba(9, 13, 22, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border-dark);
    padding: 0.6rem 1rem calc(0.6rem + var(--safe-bottom)) 1rem;
    flex-shrink: 0;
  }

  form {
    display: flex;
    gap: 0.6rem;
    max-width: 860px;
    margin: 0 auto;
    align-items: center;
  }

  .upload-btn-label {
    padding: 0.85rem;
    border: 1px solid var(--border-dark);
    border-radius: 16px;
    background: rgba(19, 27, 46, 0.8);
    color: #fcd34d;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .upload-btn-label:hover {
    background: #1e293b;
    border-color: var(--accent);
  }

  input[type="file"] {
    display: none;
  }

  input[type="text"] {
    flex: 1;
    padding: 0.85rem 1.15rem;
    border: 1px solid var(--border-dark);
    border-radius: 16px;
    font-size: 0.95rem;
    font-family: inherit;
    background: rgba(19, 27, 46, 0.8);
    color: var(--text-main);
    outline: none;
    transition: all 0.2s ease;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
    background: rgba(19, 27, 46, 0.95);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  button {
    padding: 0.85rem 1.35rem;
    border: none;
    border-radius: 16px;
    background: var(--accent-gradient);
    color: #fff;
    font-weight: 600;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px var(--accent-glow);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    flex-shrink: 0;
  }

  button:active, button:hover {
    transform: scale(0.97);
    box-shadow: 0 2px 8px var(--accent-glow);
  }

  /* Responsive Mobile Tweaks */
  @media (max-width: 640px) {
    header {
      font-size: 1.25rem;
      padding: 0 1rem;
    }
    header .subtitle {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
    }
    .bubble {
      max-width: 92%;
      font-size: 0.9rem;
      padding: 0.75rem 1rem;
    }
    #log {
      padding: 0.75rem 0.75rem 1rem 0.75rem;
      gap: 1rem;
    }
    button span.btn-text {
      display: none;
    }
    button {
      padding: 0.85rem 1rem;
      border-radius: 14px;
    }
    input[type="text"] {
      border-radius: 14px;
      padding: 0.8rem 1rem;
    }
  }

  /* --- A2UI Surface Components --- */
  .a2card {
    border: 1px solid var(--border-dark);
    border-radius: 16px;
    padding: 1.2rem;
    background: rgba(19, 27, 46, 0.95);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    max-width: 100%;
    color: var(--text-main);
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.6rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; }
  .a2text.a2-h1 { font-size: 1.35rem; font-weight: 700; color: #fcd34d; font-family: 'MedievalSharp', cursive; }
  .a2text.a2-h2 { font-size: 1.15rem; font-weight: 700; color: #fbbf24; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: #f59e0b; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.825rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border-dark); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; border: 1px solid var(--border-dark); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: #f59e0b; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-icon">🛡️</span>
    <span>Fantasy DM</span>
  </div>
  <span class="subtitle">AI Campaign Companion</span>
</header>

<div id="log"></div>

<div class="attachment-preview" id="attachmentPreview">
  <div class="attachment-badge">
    <span class="material-symbols-outlined" style="font-size:1rem;">attach_file</span>
    <span id="attachmentName">file.pdf</span>
    <span class="attachment-remove" onclick="removeAttachment()">✕</span>
  </div>
</div>

<div class="footer-container">
  <!-- Interactive Prompt Carousel -->
  <div class="prompts-container">
    <div class="prompt-chip" onclick="sendPrompt('🎲 Roll a d20 with a +5 strength modifier for my sword strike!')">
      <span>🎲 Roll d20 (+5 Mod)</span>
    </div>
    <div class="prompt-chip" onclick="sendPrompt('📜 What is my character status, health, and active campaign quests?')">
      <span>📜 Character & Quest Log</span>
    </div>
    <div class="prompt-chip" onclick="sendPrompt('🎨 Generate an epic visual illustration of a glowing ancient spell tome')">
      <span>🎨 Generate Visual</span>
    </div>
    <div class="prompt-chip" onclick="sendPrompt('🎬 Generate a short video demonstration of an enchanted flame sword')">
      <span>🎬 Generate Video</span>
    </div>
  </div>

  <form id="form">
    <label class="upload-btn-label" title="Attach PDF, Word Doc, or Photo">
      <span class="material-symbols-outlined" style="font-size:1.25rem;">attach_file</span>
      <input type="file" id="fileInput" accept=".pdf,.doc,.docx,image/*">
    </label>
    <input type="text" id="input" placeholder="Consult DM or attach PDF / Doc / Photo..." autocomplete="off" autofocus>
    <button id="sendBtn">
      <span class="btn-text">Send</span>
      <span class="material-symbols-outlined" style="font-size:1.1rem; color:#fff;">send</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const fileInput = document.getElementById("fileInput");
const attachmentPreview = document.getElementById("attachmentPreview");
const attachmentName = document.getElementById("attachmentName");

fileInput.addEventListener("change", () => {
  if (fileInput.files && fileInput.files[0]) {
    attachmentName.textContent = fileInput.files[0].name;
    attachmentPreview.style.display = "flex";
  } else {
    removeAttachment();
  }
});

function removeAttachment() {
  fileInput.value = "";
  attachmentPreview.style.display = "none";
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const author = el("div", "msg-author", who === "user" ? "👤 You" : "🧙‍♂️ Dungeon Master");
  m.appendChild(author);
  const b = el("div", "bubble");
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

function sendPrompt(promptText) {
  input.value = promptText;
  form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
}

/* ----------------------------------------------------------------------------
 * A2UI renderer (v0.8 Basic Catalog).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  const hasFile = fileInput.files && fileInput.files[0];
  if (!text && !hasFile) return;

  let displayText = text;
  if (hasFile) {
    displayText = (text ? text + " " : "") + `[Attached ${fileInput.files[0].name}]`;
  }
  bubble("user").textContent = displayText;

  const formData = new FormData();
  formData.append("message", text);
  if (hasFile) {
    formData.append("file", fileInput.files[0]);
  }

  input.value = "";
  removeAttachment();

  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", body: formData });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
